name: manifest-contract-ci

on:
  pull_request:
  push:
    branches:
      - fix/modernize-manifest-enums-20261006

permissions:
  contents: read

jobs:
  manifest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pydantic>=2.10,<3" "pytest>=8,<10" "ruff>=0.8,<1"
      - run: ruff check contracts
      - run: pytest -q tests/test_ecosystem_e2e.py
