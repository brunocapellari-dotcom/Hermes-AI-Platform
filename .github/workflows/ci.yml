name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hermes-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract test dependencies
        run: python -m pip install "pydantic>=2.10,<3" "pytest>=8,<10" "ruff>=0.8,<1" "mypy>=1.13,<2" "bandit>=1.8,<2"
      - name: Compile contracts
        run: python -m compileall -q contracts
      - name: Ruff
        run: ruff check contracts tests
      - name: Strict typing
        run: mypy contracts
      - name: Contract tests
        run: pytest -q tests
      - name: Static security scan
        run: bandit -q -r contracts
