name: hermes-ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hermes-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-security-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: bandit -q -r src
      - run: pip-audit
      - name: Validate database migrations
        env:
          HERMES_DATABASE_URL: sqlite:////tmp/hermes-migration.db
        run: alembic upgrade head
      - run: pytest

  authorization-policy-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned OPA v1.20.2
        run: |
          curl -fsSLo /tmp/opa https://github.com/open-policy-agent/opa/releases/download/v1.20.2/opa_linux_amd64
          echo "ed3127751a4c786eb407d26a952c92f45fdcc4b97e0af25cd5d721a414fab244  /tmp/opa" | sha256sum -c -
          chmod +x /tmp/opa
      - name: Validate and test OPA policy
        run: |
          /tmp/opa check --strict policy/opa
          /tmp/opa test policy/opa --verbose
      - name: Install pinned OpenFGA CLI v0.7.20
        run: |
          curl -fsSLo /tmp/fga.tar.gz https://github.com/openfga/cli/releases/download/v0.7.20/fga_0.7.20_linux_amd64.tar.gz
          echo "f0136868bdced6f8fded1876d41aa8d594d23588183497f6d876c1a5343529a4  /tmp/fga.tar.gz" | sha256sum -c -
          tar -xzf /tmp/fga.tar.gz -C /tmp
      - name: Validate OpenFGA authorization model
        run: /tmp/fga model validate --file policy/openfga/model.fga

  repository-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2 / zizmor 1.29.0
        with:
          persona: auditor
          min-severity: medium
          advanced-security: false
          annotations: true
          online-audits: true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      - name: Filesystem and IaC misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          cache: "true"

  container-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: hermes-ai-platform:ci
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: hermes-ai-platform:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          dependency-snapshot: false
      - name: Validate SBOM
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("sbom.cdx.json")
          data = json.loads(p.read_text())
          assert data.get("bomFormat") == "CycloneDX"
          assert data.get("components"), "SBOM must contain components"
          print(f"SBOM components: {len(data['components'])}")
          PY
      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: hermes-ai-platform:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "1"
          cache: "true"

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/gcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
