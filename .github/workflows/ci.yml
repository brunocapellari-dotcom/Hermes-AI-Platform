name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hermes-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install contract test dependencies
        run: python -m pip install "pydantic>=2.10,<3" "pytest>=8,<10" "ruff>=0.8,<1" "mypy>=1.13,<2" "bandit>=1.8,<2" "pytest-cov>=6.2,<8"
      - name: Compile contracts
        run: python -m compileall -q contracts
      - name: Ruff
        run: ruff check contracts tests
      - name: Strict typing
        run: mypy contracts
      - name: Contract tests
        run: pytest -q -o addopts="" tests/test_ecosystem_e2e.py
      - name: Static security scan
        run: bandit -q -r contracts
