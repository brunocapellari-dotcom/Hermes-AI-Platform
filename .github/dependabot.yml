version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Cuiaba"
    open-pull-requests-limit: 3
    groups:
      python-runtime:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: "America/Cuiaba"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci

  - package-ecosystem: terraform
    directory: "/infra/gcp"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: "America/Cuiaba"
    open-pull-requests-limit: 2
    groups:
      terraform-providers:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - infrastructure
