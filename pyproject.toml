[project]
name = "hermes-ai-platform"
version = "0.1.0"
description = "Shared AI orchestration platform for the Hermes ecosystem"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "cloud-sql-python-connector[psycopg]>=1.22,<2",
  "dbos[otel]>=2.28,<3",
  "fastapi>=0.116,<1",
  "google-auth>=2.40,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "prometheus-client>=0.22,<1",
  "structlog>=25.4,<26",
  "tenacity>=9.1,<10",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]
mcp = [
  "mcp>=2.2,<3",
]
privacy = [
  "presidio-analyzer>=2.2.364,<3",
  "presidio-anonymizer>=2.2.364,<3",
]
evals = [
  "inspect-ai>=0.3.263,<0.4",
  "lm-eval>=0.4.13,<0.5",
]

[project.scripts]
hermes-worker = "hermes.worker:main"
hermes-migrate-db = "hermes.db_migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings --cov=hermes --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
