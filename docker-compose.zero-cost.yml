services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HERMES_ENVIRONMENT: production
      HERMES_ZERO_COST_MODE: "true"
      HERMES_DATABASE_URL: sqlite:////data/hermes.db
      HERMES_AUTO_CREATE_SCHEMA: "true"
      HERMES_SERVICE_AUTH_REQUIRED: "false"
      HERMES_SERVICE_TO_SERVICE_AUTH: "false"
      HERMES_EXTERNAL_AUTHORIZATION_REQUIRED: "false"
      HERMES_ALLOW_EXTERNAL_ACTIONS: "false"
      HERMES_MODEL_GATEWAY_URL: ""
      HERMES_MODEL_GATEWAY_API_KEY: ""
      HERMES_OTLP_ENDPOINT: ""
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - hermes_zero_cost_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  hermes_zero_cost_data:
